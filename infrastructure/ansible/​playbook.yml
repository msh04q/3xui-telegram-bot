---
- name: Deploy VPN & Monitoring via Docker Compose
  hosts: vpn_nodes
  become: true
  vars:
    project_dir: "/opt/3xui-bot"
    repo_url: "https://github.com/your-username/3xui-telegram-bot.git"

  tasks:
    - name: Install Docker & Dependencies
      apt:
        update_cache: yes
        name:
          - git
          - curl
          - ufw
          - docker.io
          - docker-compose-v2
        state: present

    - name: Ensure Docker service is active
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Configure UFW Rules
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ['22', '80', '443', '2096', '3000'] # 3000 для доступа к Grafana

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Install 3X-UI Panel natively (Host network)
      shell: |
        curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh | bash -s -- -y
      args:
        creates: /usr/local/x-ui/x-ui

    - name: Clone Project Repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: main
        force: yes

    - name: Run Docker Compose Stack
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
        build: always
