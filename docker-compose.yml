version: '3.8'

services:
  bot:
    build: .
    container_name: 3xui_bot
    restart: always
    env_file:
      - .env
    network_mode: "host" # Позволяет боту напрямую стучаться в 3X-UI на 127.0.0.1

  nginx:
    image: nginx:alpine
    container_name: camouflage_nginx
    restart: always
    ports:
      - "127.0.0.1:8080:8080" # Открыт только для локального камуфляжа Xray
    volumes:
      - ./infrastructure/ansible/files/camouflage.html:/usr/share/nginx/html/index.html:ro
      - ./infrastructure/ansible/files/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin_secure_pass}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000" # Панель мониторинга на порту 3000

volumes:
  prometheus_data:
  grafana_data:
